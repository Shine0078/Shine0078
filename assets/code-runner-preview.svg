<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="312" viewBox="0 0 1200 312" role="img" aria-labelledby="title description">
  <title id="title">Code Runner by Shine0078 — a little endless arcade game</title>
  <desc id="description">A hand-drawn inspired cream-and-coral arcade postcard with an animated spaceship, falling golden gems and a mischievous bug. Click to play.</desc>
  <defs>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".7" fill="#26342f" opacity=".15"/></pattern>
    <pattern id="stars" width="64" height="52" patternUnits="userSpaceOnUse"><circle cx="8" cy="18" r="2" fill="#efdfbb" opacity=".4"/><circle cx="37" cy="43" r="1.5" fill="#efdfbb" opacity=".2"/></pattern>
    <clipPath id="playground"><rect x="727" y="42" width="432" height="225" rx="7"/></clipPath>
    <style>
      .ship { animation: ship 3.8s ease-in-out infinite; transform-origin: center; }
      .gem { animation: fall 3.1s linear infinite; }
      .gem.second { animation-delay: -1.75s; }
      .bug { animation: fall 4s linear infinite; animation-delay: -1s; }
      .wiggle { animation: wiggle 2s ease-in-out infinite; transform-origin: 636px 86px; }
      @keyframes ship { 0%,100% { transform: translateX(-64px); } 50% { transform: translateX(69px); } }
      @keyframes fall { from { transform:translateY(-100px); } to { transform:translateY(276px); } }
      @keyframes wiggle { 0%,100% { transform:rotate(-10deg) } 50% { transform:rotate(15deg) } }
      @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}}
    </style>
  </defs>
  <rect width="1200" height="312" rx="12" fill="#f2ebd9"/>
  <rect width="1200" height="312" rx="12" fill="url(#dots)"/>
  <rect x="3" y="3" width="1194" height="306" rx="10" fill="none" stroke="#26342f" stroke-width="5"/>
  <text x="51" y="47" fill="#9e4931" font-family="Consolas,monospace" font-size="15" font-weight="bold" letter-spacing="2">THE LITTLE ARCADE / NO. 001</text>
  <text x="51" y="137" fill="#26342f" font-family="Trebuchet MS,Arial,sans-serif" font-size="73" font-weight="900" letter-spacing="-5">CODE</text>
  <text x="259" y="137" fill="#e97650" font-family="Trebuchet MS,Arial,sans-serif" font-size="73" font-weight="900" letter-spacing="-5">RUNNER</text>
  <g class="wiggle" fill="none" stroke="#34594f" stroke-linecap="round" stroke-width="4">
    <path d="M640 66v36M622 85h36M628 73l24 25M652 73l-24 25"/>
  </g>
  <text x="53" y="177" fill="#41584d" font-family="Trebuchet MS,Arial,sans-serif" font-size="18">Catch gems. Dodge bugs. See how far you can go.</text>
  <rect x="57" y="215" width="269" height="58" rx="6" fill="#26342f"/>
  <rect x="52" y="210" width="269" height="58" rx="6" fill="#e97650" stroke="#26342f" stroke-width="3"/>
  <text x="75" y="247" fill="#26342f" font-family="Consolas,monospace" font-size="22" font-weight="bold">▶ PLAY THE GAME</text>
  <text x="351" y="230" fill="#34594f" font-family="Consolas,monospace" font-size="14" font-weight="bold">ENDLESS WAVES</text>
  <text x="351" y="251" fill="#34594f" font-family="Consolas,monospace" font-size="13">ARROWS / A-D / TOUCH</text>
  <rect x="722" y="37" width="442" height="236" rx="9" fill="#26342f"/>
  <rect x="727" y="42" width="432" height="225" rx="7" fill="#203d37"/>
  <g clip-path="url(#playground)">
    <rect x="727" y="42" width="432" height="225" fill="url(#stars)"/>
    <circle cx="1058" cy="157" r="53" fill="#3b6254"/>
    <circle cx="1047" cy="146" r="51" fill="#24463f"/>
    <path d="M727 220H1159M727 252H1159M790 88v179M853 88v179M916 88v179M979 88v179M1042 88v179M1105 88v179" stroke="#d8dcc5" opacity=".08"/>
    <rect x="727" y="42" width="432" height="38" fill="#bfd8a9"/>
    <text x="742" y="66" fill="#26342f" font-family="Consolas,monospace" font-size="14" font-weight="bold">XP 260</text>
    <text x="925" y="66" fill="#b4513b" font-family="Consolas,monospace" font-size="15" font-weight="bold">♥ ♥ ♥</text>
    <text x="1075" y="66" fill="#26342f" font-family="Consolas,monospace" font-size="13" font-weight="bold">WAVE 03</text>
    <g class="gem">
      <path d="M824 103l16 21-16 21-16-21z" fill="#f7cb67" stroke="#fff2c6" stroke-width="3"/>
      <path d="M824 103v42l16-21z" fill="#dc944c"/>
    </g>
    <g class="gem second">
      <path d="M1096 113l13 19-13 19-13-19z" fill="#f7cb67" stroke="#fff2c6" stroke-width="2"/>
      <path d="M1096 113v38l13-19z" fill="#dc944c"/>
    </g>
    <g class="bug">
      <path d="M974 105l-12-6M974 120l-13 7M1010 105l12-6M1010 120l13 7" stroke="#e88969" stroke-width="4"/>
      <path d="M979 91h26l9 14-9 20h-26l-9-20z" fill="#d76f55" stroke="#f5b28d" stroke-width="3"/>
      <path d="M981 102h8m7 0h8" stroke="#fff4dc" stroke-width="5"/>
      <path d="M985 116h14" stroke="#26342f" stroke-width="3"/>
    </g>
    <g class="ship">
      <path d="M949 215l-12 30 12-6 12 6z" fill="#e97650"/>
      <path d="M949 169l25 55-14-9-11 7-11-7-14 9z" fill="#f6d59e" stroke="#fdf2d8" stroke-width="3"/>
      <path d="M949 174l11 22-11-8-11 8z" fill="#e87553"/>
      <path d="M949 198l9 11-9 7-9-7z" fill="#47776d"/>
    </g>
  </g>
  <rect x="727" y="42" width="432" height="225" rx="7" fill="none" stroke="#26342f" stroke-width="4"/>
  <text x="50" y="295" font-family="Consolas,monospace" font-size="11" font-weight="bold" fill="#596559">AN EXPERIMENT BY SHINE0078  ·  LEARNING &amp; BUILDING ONE PROJECT AT A TIME</text>
</svg>