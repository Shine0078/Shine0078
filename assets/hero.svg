<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-labelledby="title desc">
<title id="title">Samuel - software, support and secure systems</title>
<desc id="desc">Animated midnight-blue engineering command center, circuit grids and orbiting signal nodes.</desc>
