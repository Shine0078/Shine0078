<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
<title id="title">Hi, I'm Samuel — aspiring developer, learning as I build</title>
<desc id="desc">A warm illustrated GitHub header with paper texture, coral typography, a coding window, a sticky note and animated doodles.</desc>
<defs>
<pattern id="paper" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="0.8" fill="#617066" opacity=".18"/></pattern>
<clipPath id="frame"><rect width="1280" height="360" rx="16"/></clipPath>
<style>
.twinkle{animation:twinkle 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.twinkle.alt{animation-delay:-1.5s}
.cursor{animation:blink 1.2s step-end infinite}
@keyframes twinkle{50%{transform:scale(.8) rotate(10deg);opacity:.55}}@keyframes blink{50%{opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</defs>
<g clip-path="url(#frame)">
<rect width="1280" height="360" fill="#f2ebd9"/>
<rect width="1280" height="360" fill="url(#paper)"/>
<rect x="5" y="5" width="1270" height="350" rx="11" fill="none" stroke="#26342f" stroke-width="5"/>
<text x="59" y="51" fill="#9e4931" font-family="Consolas,monospace" font-size="17" font-weight="bold" letter-spacing="2">THE LITTLE WORKSHOP / SHINE0078</text>
<text x="57" y="113" fill="#26342f" font-family="Trebuchet MS,Arial,sans-serif" font-size="34" font-weight="900">HI, I'M</text>
<text x="53" y="218" fill="#26342f" font-family="Trebuchet MS,Arial,sans-serif" font-size="110" font-weight="900" letter-spacing="-6">SAMUEL<tspan fill="#e97650">.</tspan></text>
<path d="M60 230H469" fill="none" stroke="#e97650" stroke-width="9" stroke-linecap="round"/>
<text x="61" y="268" fill="#26342f" font-family="Trebuchet MS,Arial,sans-serif" font-size="26" font-weight="bold">Aspiring developer. Learning as I build.</text>
<text x="62" y="303" fill="#52665b" font-family="Trebuchet MS,Arial,sans-serif" font-size="23">Sharing little projects and what they teach me.</text>
<text x="62" y="332" fill="#a45038" font-family="Consolas,monospace" font-size="14" font-weight="bold">CODE  /  IT  /  SECURITY  /  LOTS OF CURIOSITY</text>
<!-- Off-white retro editor with a warm mint title bar -->
<rect x="794" y="80" width="394" height="237" rx="13" fill="#26342f"/>
<rect x="778" y="63" width="394" height="237" rx="12" fill="#fff9e9" stroke="#26342f" stroke-width="5"/>
<path d="M778 100V75Q778 63 790 63H1160Q1172 63 1172 75V100Z" fill="#bfd8a9"/>
<path d="M778 100H1172" fill="none" stroke="#26342f" stroke-width="4"/>
<circle cx="804" cy="82" r="7" fill="#e97650" stroke="#26342f" stroke-width="2"/>
<circle cx="827" cy="82" r="7" fill="#f7cb67" stroke="#26342f" stroke-width="2"/>
<circle cx="850" cy="82" r="7" fill="#fff9e9" stroke="#26342f" stroke-width="2"/>
<text x="872" y="87" font-family="Consolas,monospace" font-weight="bold" font-size="15" fill="#26342f">small-steps.js</text>
<rect x="801" y="117" width="345" height="156" rx="7" fill="#24463f"/>
<g font-family="Consolas,monospace" font-weight="bold" font-size="19">
<text x="817" y="151" fill="#f7cb67">01  <tspan fill="#f9edd0">const</tspan> <tspan fill="#f0a879">samuel</tspan> = {</text>
<text x="817" y="181" fill="#f7cb67">02    <tspan fill="#bfd8a9">learning:</tspan> <tspan fill="#fff0ca">true,</tspan></text>
<text x="817" y="211" fill="#f7cb67">03    <tspan fill="#bfd8a9">building:</tspan> <tspan fill="#fff0ca">true,</tspan></text>
<text x="817" y="241" fill="#f7cb67">04  }; <tspan fill="#f7cb67" class="cursor">_</tspan></text>
</g>
<!-- Handwritten sticky note tucked at the corner of the code window -->
<g transform="rotate(-8 766 270)">
<rect x="717" y="225" width="99" height="85" rx="5" fill="#26342f"/>
<rect x="711" y="219" width="99" height="85" rx="5" fill="#f7cb67" stroke="#26342f" stroke-width="3"/>
<text x="760" y="251" text-anchor="middle" fill="#26342f" font-family="Consolas,monospace" font-size="13" font-weight="bold">KEEP</text>
<text x="760" y="269" text-anchor="middle" fill="#26342f" font-family="Consolas,monospace" font-size="13" font-weight="bold">TRYING!</text>
<path d="M741 282q17 12 34 0" fill="none" stroke="#26342f" stroke-width="3" stroke-linecap="round"/>
</g>
<g class="twinkle" fill="none" stroke="#e97650" stroke-width="5" stroke-linecap="round">
<path d="M683 91v40M663 111h40M670 98l26 26M696 98l-26 26"/>
</g>
<g class="twinkle alt" fill="none" stroke="#34594f" stroke-width="4" stroke-linecap="round">
<path d="M1207 213v28M1193 227h28M1198 218l18 18M1216 218l-18 18"/>
</g>
<text x="1195" y="340" text-anchor="end" fill="#52665b" font-family="Consolas,monospace" font-size="12" font-weight="bold">ONE PROJECT AT A TIME · NO. 001</text>
</g>
</svg>